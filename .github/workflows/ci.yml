name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpstan:
    name: PHPStan (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        typo3: ['^13.4', '^14.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: |
          composer config --no-plugins allow-plugins.typo3/cms-composer-installers false
          composer config --no-plugins allow-plugins.typo3/class-alias-loader false
          composer require --no-update \
            "typo3/cms-core:${{ matrix.typo3 }}" \
            "typo3/cms-backend:${{ matrix.typo3 }}" \
            "typo3/cms-extbase:${{ matrix.typo3 }}"
          composer update --no-progress
      - run: vendor/bin/phpstan analyse

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: |
          composer config --no-plugins allow-plugins.typo3/cms-composer-installers false
          composer config --no-plugins allow-plugins.typo3/class-alias-loader false
          composer install --no-progress
      - run: vendor/bin/phpcs
